# /etc/apache2/conf-available/security-hardening.conf
# เปิดใช้: sudo a2enconf security-hardening && sudo a2enmod headers && sudo systemctl reload apache2
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000"
</IfModule>

# ห้ามรันไฟล์ PHP ในโฟลเดอร์อัปโหลด
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
</Directory>

# ปิด xmlrpc.php (ช่องทางโจมตี brute-force ที่พบบ่อย)
<Files xmlrpc.php>
    Require all denied
</Files>
