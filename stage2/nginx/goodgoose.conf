# nginx reverse proxy หน้า Apache — วางที่ /etc/nginx/sites-available/goodgoose.conf
limit_req_zone $binary_remote_addr zone=wplogin:10m rate=5r/m;
proxy_cache_path /var/cache/nginx/gg levels=1:2 keys_zone=gg:10m max_size=200m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name goodgoose.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 24.04 มี nginx 1.24 จึงใช้ http2 แบบเก่าใน listen
    listen 443 ssl http2;
    server_name goodgoose.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/goodgoose.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goodgoose.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 64m;
    include snippets/gg-headers.conf;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /xmlrpc.php { return 403; }
    location ~ /\.(?!well-known) { deny all; }
    location ~* ^/wp-content/uploads/.*\.php$ { deny all; }

    location = /wp-login.php {
        limit_req zone=wplogin burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }

    location /gg-dashboard/ {
        alias /var/www/gg-dashboard/;
        auth_basic "GoodGoose dashboard";
        auth_basic_user_file /etc/nginx/.gg-htpasswd;
        add_header Cache-Control "no-store" always;
        include snippets/gg-headers.conf;
    }

    location / {
        set $skip 0;
        if ($request_method = POST) { set $skip 1; }
        if ($query_string != "") { set $skip 1; }
        if ($request_uri ~* "/wp-admin/|/wp-login.php|/wp-json/|preview=true") { set $skip 1; }
        if ($http_cookie ~* "wordpress_logged_in|comment_author|wp-postpass") { set $skip 1; }

        proxy_cache gg;
        proxy_cache_valid 200 301 10m;
        proxy_cache_bypass $skip;
        proxy_no_cache $skip;
        proxy_cache_use_stale error timeout updating;

        # add_header ใน location ทำให้ header ระดับ server ไม่ถูกสืบทอด จึง include ซ้ำ
        add_header X-Cache-Status $upstream_cache_status always;
        include snippets/gg-headers.conf;
        proxy_pass http://127.0.0.1:8080;
    }
}
