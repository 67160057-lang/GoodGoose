# Apache อยู่หลัง nginx ฟังเฉพาะในเครื่อง — วางที่ /etc/apache2/sites-available/gg-backend.conf
<VirtualHost 127.0.0.1:8080>
    ServerName goodgoose.duckdns.org
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    # ให้ Apache/WordPress เห็น IP จริงของผู้ใช้ ไม่ใช่ 127.0.0.1
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 127.0.0.1

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
